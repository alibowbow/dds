<style>
  .hub-page{
    --hub-canvas:#fafaff;
    --hero-ink:#fff;
    --hero-muted:rgba(255,255,255,.78);
    --hero-line:rgba(255,255,255,.2);
    --hero-grid:rgba(255,255,255,.07);
    background:
      radial-gradient(780px 360px at 76% -5%,rgba(99,102,241,.11),transparent 72%),
      linear-gradient(180deg,var(--hub-canvas) 0,var(--bg) 560px)}
  .hub-header{background:color-mix(in srgb,var(--surface) 96%,transparent);border-bottom:1px solid var(--line)}
  .hub-header-inner{height:66px;display:flex;align-items:center;gap:16px}
  .hub-brand{display:inline-flex;align-items:center;gap:11px;min-height:48px;color:var(--ink)}
  .hub-brand:hover{text-decoration:none}
  .hub-brand .logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#6259ef,var(--brand-strong));color:#fff;box-shadow:0 7px 18px rgba(79,70,229,.2)}
  .hub-brand .logo svg{width:22px;height:22px}
  .hub-wordmark{line-height:1.1}
  .hub-wordmark b{font-size:.97rem;letter-spacing:-.025em}
  .hub-header .themebtn{margin-left:auto}

  .hub-main{padding:20px 0 var(--sp-8)}
  .hub-intro{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.14fr) minmax(230px,.56fr);grid-template-rows:auto 1fr;gap:18px clamp(24px,4vw,46px);overflow:hidden;
    min-height:340px;padding:31px 34px 29px 40px;border:1px solid rgba(255,255,255,.24);border-radius:20px;color:var(--hero-ink);background:
    radial-gradient(430px 300px at 89% 18%,rgba(255,255,255,.22),transparent 66%),
    radial-gradient(620px 400px at 58% 120%,rgba(63,42,176,.34),transparent 70%),
    linear-gradient(132deg,#5140c6 0%,#7462e4 54%,#a294f5 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 24px 58px rgba(68,51,170,.2)}
  .hub-intro::before{content:"";position:absolute;inset:0;z-index:-2;background:
    linear-gradient(90deg,var(--hero-grid) 1px,transparent 1px),
    linear-gradient(0deg,var(--hero-grid) 1px,transparent 1px);
    background-size:52px 52px;mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.55) 66%,transparent)}
  .hub-intro::after{content:"";position:absolute;z-index:-1;width:380px;height:380px;right:-118px;top:-204px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 72px rgba(255,255,255,.035),0 0 0 144px rgba(255,255,255,.025)}
  .intro-copy{position:relative;z-index:1;align-self:end;min-width:0;padding-top:5px}
  .hub-intro h1{margin:0;color:var(--hero-ink);font-size:clamp(2.35rem,4.2vw,3.55rem);line-height:.98;letter-spacing:-.06em;text-shadow:0 2px 22px rgba(38,26,120,.18)}

  .quick-panel{position:relative;z-index:2;align-self:start;max-width:650px;padding:14px;border:1px solid rgba(255,255,255,.18);border-radius:15px;background:rgba(40,27,128,.3);box-shadow:0 12px 28px rgba(39,27,119,.13),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(8px)}
  .quick-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--hero-muted)}
  .quick-head::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.12)}
  .quick-head b{font-size:var(--text-xs);letter-spacing:.025em}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .quick-link{--quick:var(--brand);position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) 16px;align-items:center;gap:11px;min-height:68px;padding:11px 12px;border:1px solid rgba(255,255,255,.18);border-radius:11px;color:#fff;background:rgba(255,255,255,.105);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    transition:background-color var(--dur),border-color var(--dur),transform var(--dur) var(--ease),box-shadow var(--dur)}
  .quick-link::after{content:"›";color:#fff;font-size:1.35rem;line-height:1;opacity:.62;transition:transform var(--dur),opacity var(--dur)}
  .quick-link:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);transform:translateY(-2px);box-shadow:0 8px 18px rgba(38,26,117,.16);text-decoration:none}
  .quick-link:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .quick-link:hover::after{transform:translateX(2px);opacity:1}
  .quick-link .ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff}
  .quick-link .ic svg{width:21px;height:21px}
  .quick-link span:nth-child(2){min-width:0}
  .quick-link b{font-size:var(--text-sm);line-height:1.25}

  .dental-visual{position:relative;grid-column:2;grid-row:1/3;align-self:stretch;display:grid;place-items:center;min-width:0;min-height:270px}
  .dental-visual::before{content:"";position:absolute;width:min(100%,272px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,.055) 52%,transparent 72%)}
  .dental-visual::after{content:"";position:absolute;width:min(82%,220px);aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:47% 53% 56% 44%/44% 43% 57% 56%;transform:rotate(15deg)}
  .tooth-art{position:relative;z-index:1;width:auto;height:258px;max-width:76%;object-fit:contain;filter:drop-shadow(0 20px 20px rgba(40,27,120,.3))}

  .library{padding:22px 0 0}
  .library-shell{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 18px 46px rgba(25,30,60,.055)}
  .library-tools{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:19px 20px 16px;border-bottom:1px solid var(--line)}
  .library-title h2{margin:0;font-size:clamp(1.35rem,2.5vw,1.7rem)}
  .hub-search{position:relative;display:flex;align-items:center;width:min(100%,460px)}
  .hub-search>svg{position:absolute;left:15px;width:19px;height:19px;color:var(--ink-3);pointer-events:none}
  .hub-search input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:0 54px 0 44px;outline:none;transition:border-color var(--dur),box-shadow var(--dur),background-color var(--dur)}
  .hub-search input::placeholder{color:var(--ink-3)}
  .hub-search input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}
  .hub-search kbd{position:absolute;right:13px;display:grid;place-items:center;min-width:26px;height:25px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--surface);color:var(--ink-2);font:700 .72rem/1 system-ui}

  .library-layout{min-width:0}
  .library-rail{display:flex;gap:2px;overflow-x:auto;padding:0 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 48%,var(--surface));scrollbar-width:none}
  .library-rail::-webkit-scrollbar{display:none}
  .filter{appearance:none;position:relative;flex:0 0 auto;border:0;background:transparent;color:var(--ink-2);min-height:49px;padding:0 12px;display:flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;font-size:var(--text-xs);font-weight:750;transition:color var(--dur),background-color var(--dur)}
  .filter:hover{background:color-mix(in srgb,var(--brand-soft) 42%,transparent);color:var(--ink)}
  .filter[aria-pressed="true"]{border-radius:8px;background:color-mix(in srgb,var(--brand-soft) 72%,transparent);color:var(--brand);font-weight:900}
  .filter span{min-width:23px;text-align:center;padding:2px 6px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-3);font-size:.68rem;font-variant-numeric:tabular-nums}
  .filter[aria-pressed="true"] span{background:var(--brand-soft);color:var(--brand)}

  .library-results{min-width:0}
  .result-head{min-height:40px;display:flex;align-items:center;gap:12px;margin:0;padding:4px 20px;border-bottom:1px solid var(--line)}
  .result-head p{margin:0;color:var(--ink-2);font-size:var(--text-xs);font-weight:800;letter-spacing:.025em}
  .reset-btn{appearance:none;margin-left:auto;border:0;background:transparent;color:var(--brand);min-height:36px;padding:0 4px;cursor:pointer;font-size:var(--text-xs);font-weight:850}
  .reset-btn:hover{text-decoration:underline}
  .note-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}
  .note-card{--note-accent:var(--brand);position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) 20px;gap:12px;align-items:center;min-height:86px;padding:13px 17px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);overflow:hidden;transition:background-color var(--dur),color var(--dur)}
  .note-card[hidden],.empty-state[hidden],.reset-btn[hidden]{display:none}
  .note-card:nth-child(odd){border-right:1px solid var(--line)}
  .note-card:hover{background:color-mix(in srgb,var(--note-accent) 5%,var(--surface));text-decoration:none}
  .note-card>.ic{width:42px;height:42px;border-radius:10px;background:color-mix(in srgb,var(--note-accent) 11%,var(--surface));color:var(--note-accent);transition:transform var(--dur) var(--ease)}
  .note-card:hover>.ic{transform:scale(1.05)}
  .note-card>.ic svg{width:21px;height:21px}
  .note-copy{min-width:0}
  .note-meta{display:flex;align-items:center;gap:7px;min-height:18px;color:var(--ink-3);font-size:.66rem;font-weight:750}
  .note-meta .tagline{color:var(--note-accent)}
  .note-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line)}
  .note-card h3{margin:4px 0 0;font-size:var(--text-base);line-height:1.36}
  .note-arrow{align-self:center;color:var(--note-accent);opacity:.5;transition:transform var(--dur),opacity var(--dur)}
  .note-arrow svg{width:17px;height:17px}
  .note-card:hover .note-arrow{opacity:1;transform:translateX(3px)}
  .empty-state{margin:18px;border:1px dashed var(--line);border-radius:11px;background:var(--surface-2);padding:38px 24px;text-align:center;color:var(--ink-2)}
  .empty-state .ic{width:44px;height:44px;margin:0 auto 10px;border-radius:10px;background:var(--surface);color:var(--ink-3)}
  .empty-state p{margin:0 0 12px}
  .empty-state button{appearance:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px;padding:0 14px;cursor:pointer;font-size:var(--text-sm);font-weight:800}

  .hub-footer{margin-top:42px;padding-bottom:28px;border-top:1px solid var(--line);color:var(--ink-3);font-size:var(--text-xs)}
  .hub-footer-inner{display:flex;align-items:center;gap:14px;padding-top:20px}
  .hub-footer b{color:var(--ink-2)}

  :root[data-theme="dark"] .hub-page{--hub-canvas:#10131d}
  :root[data-theme="dark"] .note-meta .tagline{color:color-mix(in srgb,var(--note-accent) 42%,var(--ink))}
  @media (prefers-color-scheme:dark){
    :root[data-theme="auto"] .hub-page{--hub-canvas:#10131d}
    :root[data-theme="auto"] .note-meta .tagline{color:color-mix(in srgb,var(--note-accent) 42%,var(--ink))}
  }

  @media (prefers-reduced-motion:no-preference){
    .note-card{opacity:0;animation:noteIn .35s var(--ease) forwards;animation-delay:var(--delay,0ms)}
    .tooth-art{animation:toothFloat 6s ease-in-out infinite alternate}
    @keyframes noteIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes toothFloat{to{transform:translateY(-4px)}}
  }
  @media (max-width:760px){
    .hub-main{padding-top:13px}
    .hub-intro{grid-template-columns:minmax(0,1fr) 150px;grid-template-rows:auto auto;min-height:0;gap:14px 8px;padding:22px 18px 18px 24px}
    .intro-copy{grid-column:1;grid-row:1;align-self:center}
    .hub-intro h1{font-size:clamp(1.72rem,6vw,2.3rem);line-height:1.04;letter-spacing:-.045em;text-wrap:balance}
    .dental-visual{grid-column:2;grid-row:1;min-height:132px}
    .dental-visual::before{width:158px}.dental-visual::after{width:126px}
    .tooth-art{height:166px;max-width:78%}
    .quick-panel{grid-column:1/-1;grid-row:2}
    .library-tools{align-items:stretch;flex-direction:column;gap:13px;padding:17px 16px 15px}
    .hub-search{width:100%}
  }
  @media (max-width:680px){
    .hub-header-inner{height:62px}
    .hub-brand .logo{width:36px;height:36px}.hub-brand .logo svg{width:21px;height:21px}
    .library{padding-top:16px}.library-shell{border-radius:13px}
    .library-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;overflow:visible;padding:7px}
    .filter{justify-content:center;min-width:0;min-height:44px;padding-inline:5px;border-radius:8px}
    .note-list{grid-template-columns:1fr}
    .note-card:nth-child(odd){border-right:0}
    .hub-footer{margin-top:34px}
  }
  @media (max-width:420px){
    .hub-main>.wrap{padding-inline:12px}
    .hub-intro{grid-template-columns:minmax(0,1fr) 100px;padding:19px 13px 13px 17px;border-radius:14px}
    .hub-intro::after{width:250px;height:250px;right:-112px;top:-154px}
    .hub-intro h1{font-size:clamp(1.55rem,6.8vw,1.82rem);white-space:normal}
    .dental-visual{min-height:104px}.dental-visual::before{width:110px}.dental-visual::after{width:88px}.tooth-art{height:124px;max-width:82%}
    .quick-panel{padding:10px;border-radius:12px}
    .quick-grid{gap:7px}
    .quick-link{grid-template-columns:34px minmax(0,1fr) 12px;gap:8px;min-height:60px;padding:9px 8px;border-radius:9px}
    .quick-link .ic{width:34px;height:34px;border-radius:8px}.quick-link .ic svg{width:18px;height:18px}
    .quick-link b{font-size:.78rem}
    .library-tools{padding-inline:14px}
    .result-head{padding-inline:14px}.note-card{grid-template-columns:40px minmax(0,1fr) 18px;gap:10px;padding:12px 13px}
    .note-card>.ic{width:40px;height:40px}.note-card h3{font-size:.92rem}
  }
</style>
</head>
<body class="hub-page">

<main class="hub-main" id="main-content">

<script>
const notes = [

const grid=document.getElementById('note-grid');
const query=document.getElementById('q');
const count=document.getElementById('count');
const empty=document.getElementById('empty');
const reset=document.getElementById('reset');
const filters=[...document.querySelectorAll('.filter')];
let activeFilter='all';

function card(note,index){
  const anchor=document.createElement('a');
  anchor.className='note-card';
  anchor.href=note.href;
  anchor.dataset.category=note.category;
  anchor.dataset.text=(note.title+' '+note.desc+' '+note.tag+' '+note.categoryLabel+' '+note.keywords).toLowerCase();
  anchor.style.setProperty('--note-accent',note.accent);
  anchor.style.setProperty('--delay',(Math.min(index,8)*38)+'ms');
  anchor.innerHTML=`<span class="ic"><svg aria-hidden="true"><use href="assets/icons.svg#${note.icon}"/></svg></span>
    <span class="note-copy"><span class="note-meta"><span class="tagline">${note.tag}</span><span class="dot"></span><span>${note.categoryLabel}</span></span><h3>${note.title}</h3></span>
    <span class="note-arrow" aria-hidden="true"><svg><use href="assets/icons.svg#i-arrow-right"/></svg></span>`;
  return anchor;
}

notes.forEach((note,index)=>grid.appendChild(card(note,index)));

function applyFilters(){
  const term=query.value.trim().toLowerCase();
  let shown=0;
  grid.querySelectorAll('.note-card').forEach(card=>{
    const categoryHit=activeFilter==='all'||card.dataset.category===activeFilter;
    const searchHit=!term||card.dataset.text.includes(term);
    card.hidden=!(categoryHit&&searchHit);
    if(!card.hidden) shown++;
  });
  const activeButton=filters.find(button=>button.dataset.filter===activeFilter);
  const label=activeButton?activeButton.childNodes[0].textContent.trim():'전체';
  count.textContent=`${label} · ${shown}개`;
  empty.hidden=shown!==0;
  reset.hidden=activeFilter==='all'&&!term;
}

filters.forEach(button=>button.addEventListener('click',()=>{
  activeFilter=button.dataset.filter;
  filters.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  applyFilters();
}));
query.addEventListener('input',applyFilters);

function clearAll(){
  activeFilter='all';
  query.value='';
  filters.forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.filter==='all')));
  applyFilters();
  query.focus();
}
reset.addEventListener('click',clearAll);
document.getElementById('empty-reset').addEventListener('click',clearAll);
document.addEventListener('keydown',event=>{
  const tag=((document.activeElement&&document.activeElement.tagName)||'').toLowerCase();
  if(event.key==='/'&&tag!=='input'&&tag!=='textarea'){
    event.preventDefault();query.focus();
  }else if(event.key==='Escape'&&document.activeElement===query){
    clearAll();query.blur();
  }
});
</script>
